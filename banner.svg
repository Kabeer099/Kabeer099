<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="55%" stop-color="#0d1222"/>
      <stop offset="100%" stop-color="#13192e"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="78%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#5067f4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5067f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="18%" cy="88%" r="40%">
      <stop offset="0%" stop-color="#e12d39" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e12d39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5067f4"/>
      <stop offset="50%" stop-color="#e12d39"/>
      <stop offset="100%" stop-color="#5067f4" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f4f2ec" stroke-width="1" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Main Card Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="20" fill="url(#blueGlow)"/>
  <rect width="1200" height="340" rx="20" fill="url(#redGlow)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="18.5" fill="none" stroke="#f4f2ec" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Subtle Architectural Orbits on Right -->
  <g transform="translate(980, 170)">
    <circle r="190" fill="none" stroke="#f4f2ec" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="135" fill="none" stroke="#5067f4" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle r="80" fill="none" stroke="#e12d39" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="95" cy="-95" r="5" fill="#5067f4"/>
    <circle cx="-56" cy="56" r="4" fill="#e12d39"/>
  </g>

  <!-- Top Kicker Pill -->
  <g transform="translate(64, 48)">
    <rect width="465" height="30" rx="15" fill="#f4f2ec" fill-opacity="0.06" stroke="#f4f2ec" stroke-opacity="0.14"/>
    <circle cx="18" cy="15" r="4.5" fill="#22a06b"/>
    <text x="34" y="19.5" fill="#f4f2ec" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2">FULL-STACK ENGINEER &amp; UI/UX EXPERT · KARACHI</text>
  </g>

  <!-- Main Editorial Name -->
  <text x="64" y="156" fill="#f4f2ec" font-family="'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5">
    KABEER AHMED<tspan fill="#5067f4">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="66" y="196" fill="#b8bfd4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
    Building scalable web apps, high-converting interfaces &amp; interactive 3D digital experiences.
  </text>

  <!-- Accent Divider Bar -->
  <rect x="64" y="226" width="680" height="2.5" rx="1.25" fill="url(#accentLine)"/>

  <!-- Bottom Telemetry / Metadata Strip -->
  <g transform="translate(64, 256)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="210" height="38" rx="8" fill="#5067f4" fill-opacity="0.16" stroke="#5067f4" stroke-opacity="0.45"/>
    <text x="16" y="24" fill="#f4f2ec">🌐 https://kabeer.site</text>

    <rect x="226" y="0" width="275" height="38" rx="8" fill="#e12d39" fill-opacity="0.14" stroke="#e12d39" stroke-opacity="0.4"/>
    <text x="242" y="24" fill="#f4f2ec">🏎️ kabeer.site/arcade (3D PWA)</text>

    <rect x="517" y="0" width="270" height="38" rx="8" fill="#f4f2ec" fill-opacity="0.05" stroke="#f4f2ec" stroke-opacity="0.12"/>
    <text x="533" y="24" fill="#d5d9e6">🏛️ IT Faculty @ Aptech Pakistan</text>
  </g>
</svg>
